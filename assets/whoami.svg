<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" role="img" aria-labelledby="title desc">
  <title id="title">Alex Baltazar Castellon — macOS Terminal session</title>
  <desc id="desc">macOS Terminal window running a zsh session: a typed command, an animated fastfetch block with ASCII art, and a blinking block cursor.</desc>

  <style>
    .mono { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Fira Code", monospace; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-blink { animation: blink 1.1s infinite; }
  </style>

  <defs>
    <clipPath id="type-fastfetch">
      <rect x="147" y="74" width="0" height="20">
        <animate attributeName="width" values="0;88" dur="0.9s" begin="0.5s" fill="freeze"/>
      </rect>
    </clipPath>
    <clipPath id="type-mission">
      <rect x="147" y="302" width="0" height="20">
        <animate attributeName="width" values="0;146" dur="0.7s" begin="2.6s" fill="freeze"/>
      </rect>
    </clipPath>
  </defs>

  <rect width="960" height="400" rx="11" fill="#000000"/>
  <rect x="0.5" y="0.5" width="959" height="399" rx="10.5" fill="none" stroke="#3a3a3c"/>

