<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-labelledby="title desc">
  <title id="title">Alex Baltazar Castellon — macOS Terminal session</title>
  <desc id="desc">macOS Terminal window with a zsh session: whoami, mission, expertise and uptime.</desc>

  <style>
    .mono { font-family: "SF Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, "Fira Code", monospace; }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .cursor-blink { animation: blink 1.1s infinite; }
  </style>

  <!-- ═══ TERMINAL WINDOW ═══ -->
  <rect width="960" height="380" rx="11" fill="#000000"/>
  <rect x="0.5" y="0.5" width="959" height="379" rx="10.5" fill="none" stroke="#3a3a3c"/>

  <!-- Title bar -->
  <circle cx="20" cy="18" r="6.5" fill="#FF5F57"/>
  <circle cx="40" cy="18" r="6.5" fill="#FEBC2E"/>
  <circle cx="60" cy="18" r="6.5" fill="#28C840"/>
  <text x="480" y="22" text-anchor="middle" fill="#98989d" class="mono" font-size="12">alex@dev — -zsh — 80×24</text>
  <path d="M0.5 36H959.5" stroke="#3a3a3c"/>

  <!-- ═══ SESSION ═══ -->
  <!-- last login -->
  <text x="24" y="62" fill="#98989d" class="mono" font-size="14">Last login: Sun Nov 16 01:12:04 on ttys001</text>

  <!-- whoami with verbose flag -->
  <text x="24" y="88" fill="#0a84ff" class="mono" font-size="15" font-weight="700">alex@dev</text>
  <text x="104" y="88" fill="#98989d" class="mono" font-size="15">~ %</text>
  <text x="148" y="88" fill="#f2f2f7" class="mono" font-size="15">whoami --verbose</text>
  <text x="24" y="114" fill="#f2f2f7" class="mono" font-size="15" font-weight="700">alex_baltazar</text>
  <text x="152" y="114" fill="#98989d" class="mono" font-size="15">·  full stack developer  ·  Bolivia 🇧🇴</text>

  <!-- cat mission.txt -->
  <text x="24" y="140" fill="#0a84ff" class="mono" font-size="15" font-weight="700">alex@dev</text>
  <text x="104" y="140" fill="#98989d" class="mono" font-size="15">~ %</text>
  <text x="148" y="140" fill="#f2f2f7" class="mono" font-size="15">cat mission.txt</text>
  <text x="24" y="166" fill="#f2f2f7" class="mono" font-size="15">build real systems end-to-end</text>

  <!-- ls -F expertise/ -->
  <text x="24" y="192" fill="#0a84ff" class="mono" font-size="15" font-weight="700">alex@dev</text>
  <text x="104" y="192" fill="#98989d" class="mono" font-size="15">~ %</text>
  <text x="148" y="192" fill="#f2f2f7" class="mono" font-size="15">ls -F expertise/</text>

  <text x="24" y="218" fill="#0a84ff" class="mono" font-size="15" font-weight="700">fullstack/</text>
  <text x="140" y="218" fill="#98989d" class="mono" font-size="15">Next.js · NestJS · Laravel · Django</text>

  <text x="24" y="244" fill="#0a84ff" class="mono" font-size="15" font-weight="700">mobile/</text>
  <text x="140" y="244" fill="#98989d" class="mono" font-size="15">Flutter · Dart</text>

  <text x="24" y="270" fill="#0a84ff" class="mono" font-size="15" font-weight="700">learning/</text>
  <text x="140" y="270" fill="#98989d" class="mono" font-size="15">DevOps · Cloud · AWS · GCP</text>

  <!-- uptime -->
  <text x="24" y="296" fill="#0a84ff" class="mono" font-size="15" font-weight="700">alex@dev</text>
  <text x="104" y="296" fill="#98989d" class="mono" font-size="15">~ %</text>
  <text x="148" y="296" fill="#f2f2f7" class="mono" font-size="15">uptime</text>
  <text x="24" y="322" fill="#98989d" class="mono" font-size="15">14:32  up 92 days,  4:12,  2 users,  load averages: 0.42 0.38 0.31</text>

  <!-- idle prompt + block cursor -->
  <text x="24" y="348" fill="#0a84ff" class="mono" font-size="15" font-weight="700">alex@dev</text>
  <text x="104" y="348" fill="#98989d" class="mono" font-size="15">~ %</text>
  <rect x="148" y="334" width="9" height="18" fill="#0a84ff" class="cursor-blink"/>
</svg>
