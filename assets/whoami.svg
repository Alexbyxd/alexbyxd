<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" role="img" aria-labelledby="title desc">
  <title id="title">Alex Baltazar Castellon — Full Stack Developer</title>
  <desc id="desc">Synthwave terminal profile card — Full Stack Developer from Bolivia.</desc>
  <defs>
    <linearGradient id="borderGrad" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#f72585"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <filter id="glowPink" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowCyan" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Main background -->
  <rect width="960" height="430" rx="18" fill="#10002b"/>
  <!-- Outer border gradient -->
  <rect x="9" y="9" width="942" height="412" rx="13" fill="none" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Traffic lights -->
  <circle cx="35" cy="35" r="5" fill="#FF5F57"/>
  <circle cx="54" cy="35" r="5" fill="#FEBC2E"/>
  <circle cx="73" cy="35" r="5" fill="#28C840"/>
  <text x="98" y="41" fill="#6b5b8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15">alexbyxd  ·  profile shell  ·  online</text>
  <path d="M29 58H931" stroke="#2d1b55"/>

  <!-- ═══ MAIN LEFT TERMINAL PANEL ═══ (x:29 y:74 w:600 h:320) -->
  <rect x="29" y="74" width="600" height="320" rx="9" fill="#1a0a2e" stroke="#b44fff" stroke-width="1.5"/>

  <!-- ❯ whoami command -->
  <text x="50" y="110" fill="#4cc9f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" filter="url(#glowCyan)">❯ whoami</text>

  <!-- Output line -->
  <text x="50" y="142" fill="#e0aaff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">alex_baltazar</text>
  <text x="216" y="142" fill="#6b5b8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">—</text>
  <text x="241" y="142" fill="#ffe66d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18">Full Stack Developer</text>

  <!-- Separator -->
  <path d="M50 162H610" stroke="#2d1b55"/>

  <!-- context + mission -->
  <text x="50"  y="193" fill="#6b5b8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">context:</text>
  <text x="175" y="193" fill="#b44fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">Bolivia 🇧🇴</text>
  <text x="50"  y="222" fill="#6b5b8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">mission:</text>
  <text x="175" y="222" fill="#4cc9f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">build real systems end-to-end</text>

  <!-- Separator -->
  <path d="M50 242H610" stroke="#2d1b55"/>

  <!-- ❯ ls expertise/ command -->
  <text x="50" y="271" fill="#4cc9f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20" font-weight="700" filter="url(#glowCyan)">❯ ls expertise/</text>

  <!-- Folder rows — properly spaced within panel (bottom at y:394) -->
  <text x="50"  y="304" fill="#ff9de2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">fullstack/</text>
  <text x="195" y="304" fill="#e0aaff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Next.js · NestJS · Laravel · Django</text>

  <text x="50"  y="333" fill="#ff9de2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">mobile/</text>
  <text x="195" y="333" fill="#e0aaff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">Flutter · Dart · Docker</text>

  <text x="50"  y="362" fill="#ff9de2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">learning/</text>
  <text x="195" y="362" fill="#f72585" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" filter="url(#glowPink)">DevOps · Cloud · AWS · GCP</text>

  <!-- ═══ RIGHT PANEL ═══ (x:647 y:74 w:284 h:320) -->
  <rect x="647" y="74" width="284" height="320" rx="9" fill="#1a0a2e" stroke="#b44fff" stroke-width="1.5"/>

  <text x="670" y="110" fill="#ffe66d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17">stack runtime</text>

  <!-- Decorative grid/signal art -->
  <!-- Horizontal neon lines -->
  <path d="M670 198H908M670 212H908M670 226H908" stroke="#1a0a2e" stroke-width="6" opacity=".9"/>
  <path d="M670 200C707 175 742 230 781 196S858 178 908 208" fill="none" stroke="#f72585" stroke-width="2.5" filter="url(#glowPink)"/>
  <path d="M670 218C712 193 742 248 785 214S860 198 908 224" fill="none" stroke="#4cc9f0" stroke-width="2" filter="url(#glowCyan)"/>
  <path d="M670 236C714 212 746 266 789 232S862 218 908 242" fill="none" stroke="#b44fff" stroke-width="1.5"/>

  <!-- Terminal cursor blinking block -->
  <rect x="670" y="260" width="10" height="18" fill="#f72585" opacity=".85">
    <animate attributeName="opacity" values="0.85;0;0.85" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="686" y="275" fill="#e0aaff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">npm run build</text>

  <!-- Tech badges -->
  <rect x="670" y="295" width="55" height="19" rx="4" fill="#f72585" opacity=".2"/>
  <text x="697" y="308" text-anchor="middle" fill="#f72585" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">NestJS</text>

  <rect x="733" y="295" width="55" height="19" rx="4" fill="#4cc9f0" opacity=".2"/>
  <text x="760" y="308" text-anchor="middle" fill="#4cc9f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Next.js</text>

  <rect x="796" y="295" width="60" height="19" rx="4" fill="#b44fff" opacity=".2"/>
  <text x="826" y="308" text-anchor="middle" fill="#b44fff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Flutter</text>

  <rect x="670" y="322" width="60" height="19" rx="4" fill="#ffe66d" opacity=".15"/>
  <text x="700" y="335" text-anchor="middle" fill="#ffe66d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Laravel</text>

  <rect x="738" y="322" width="55" height="19" rx="4" fill="#ff9de2" opacity=".2"/>
  <text x="765" y="335" text-anchor="middle" fill="#ff9de2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Django</text>

  <rect x="801" y="322" width="55" height="19" rx="4" fill="#4cc9f0" opacity=".15"/>
  <text x="828" y="335" text-anchor="middle" fill="#4cc9f0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">Docker</text>

  <text x="670" y="376" fill="#6b5b8e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">status: always shipping ⚡</text>
</svg>
