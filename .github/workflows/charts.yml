name: Update Charts & Radar Signals

on:
  schedule:
    # Run every Sunday at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'assets/skills.json'
      - 'assets/langmix.json'
      - 'scripts/**'
      - '.github/workflows/charts.yml'

permissions:
  contents: write

jobs:
  redraw-charts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # 3.14 because the pinned numpy/scipy in
          # scripts/banner/requirements.txt require >= 3.12.
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: scripts/banner/requirements.txt

      - name: Install banner generator dependencies
        run: python3 -m pip install -r scripts/banner/requirements.txt

      - name: Redraw Skill & Language Radars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. Redraw Full Stack Skill Radar
          python3 scripts/radar.py --data assets/skills.json -o assets/radar --values

          # 2. Redraw Live Language Radar from public repos
          python3 scripts/radar.py --github Alexbyxd \
            --exclude "html,css,scss,less,shell,makefile,dockerfile,batchfile,blade" \
            -o assets/radar-langs --values

      # The banner is a ~450 KiB generated artifact. Rebuilding it here keeps
      # its churn out of human-facing diffs: when it changes, the bot commits
      # it with [skip ci] instead of a person staging a 900 KiB diff.
      - name: Regenerate profile banner
        run: python3 scripts/banner/generate.py

      - name: Commit and Push Updated SVGs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/radar*.svg assets/banner-dark.svg
          if git diff --staged --quiet; then
            echo "No changes in radar charts or banner."
          else
            git commit -m "chore(charts): auto-sync radar charts and banner [skip ci]"
            git push
          fi
